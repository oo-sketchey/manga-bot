name: Check for new chapters

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manga-notifier

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Check MangaDex
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python manga_notifier.py --once

      - name: Remember posted chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_chapters.json || true
          git diff --cached --quiet || (git commit -m "Update seen chapters" && git push)
